[project]
name = "hermes-orca-policy-gate"
version = "0.1.0"
description = "Standalone deterministic Hermes to Orca policy gate"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
hermes-orca-gate = "hermes_orca_gate.cli:main"

[dependency-groups]
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_orca_gate"]
